name: simple-o-web

services:
  postgres:
    image: postgres
    container_name: simple-o-web-postgres
    environment:
      POSTGRES_DB: simple-o-web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - simple-o-web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  simple-o-web_postgres_data: